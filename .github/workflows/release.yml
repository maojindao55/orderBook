name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild or publish (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --title "商单管家 ${{ env.RELEASE_TAG }}" \
              --draft \
              --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            builder_args: --mac --arm64
            assets: |
              OrderBook_macOS-Apple-Silicon-__VERSION__.dmg|*.dmg
              OrderBook_macOS-Apple-Silicon-__VERSION__.zip|*.zip
          - platform: macos-latest
            builder_args: --mac --x64
            assets: |
              OrderBook_macOS-Intel-__VERSION__.dmg|*.dmg
              OrderBook_macOS-Intel-__VERSION__.zip|*.zip
          - platform: windows-latest
            builder_args: --win --x64
            assets: |
              OrderBook_Windows_x64-__VERSION__.exe|*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/import-macos-csc-cert.sh

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos-latest' && secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload renamed assets (Unix / macOS)
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version_suffix="v$(node -p "require('./package.json').version")"
          while IFS='|' read -r asset_name find_pattern; do
            if [ -z "$asset_name" ]; then
              continue
            fi
            asset_name="${asset_name//__VERSION__/$version_suffix}"
            FILE=$(find release -name "$find_pattern" -type f | head -1)
            if [ -z "$FILE" ]; then
              echo "No artifact matching $find_pattern found"
              find release -type f || true
              exit 1
            fi
            cp "$FILE" "$asset_name"
            gh release upload "${{ env.RELEASE_TAG }}" "$asset_name" \
              --repo "${{ github.repository }}" --clobber
          done <<'ASSETS'
          ${{ matrix.assets }}
          ASSETS

      - name: Upload macOS update metadata (per-arch latest-mac.yml)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ env.RELEASE_TAG }}"
          repo="${{ github.repository }}"
          version_suffix="v$(node -p "require('./package.json').version")"
          arm_dmg="OrderBook_macOS-Apple-Silicon-${version_suffix}.dmg"
          arm_zip="OrderBook_macOS-Apple-Silicon-${version_suffix}.zip"
          x64_dmg="OrderBook_macOS-Intel-${version_suffix}.dmg"
          x64_zip="OrderBook_macOS-Intel-${version_suffix}.zip"
          yml=$(find release -name latest-mac.yml -type f | head -1)
          if [ -z "$yml" ]; then
            echo "No latest-mac.yml found; skipping"
            exit 0
          fi
          sed -i.bak \
            -e "s#商单管家-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}-mac-arm64\.dmg#${arm_dmg}#g" \
            -e "s#商单管家-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}-mac-x64\.dmg#${x64_dmg}#g" \
            -e "s#商单管家-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}-mac-arm64\.zip#${arm_zip}#g" \
            -e "s#商单管家-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}-mac-x64\.zip#${x64_zip}#g" \
            "$yml"
          if echo "${{ matrix.builder_args }}" | grep -q -- '--arm64'; then
            arch_tag="arm64"
          else
            arch_tag="x64"
          fi
          cp "$yml" "latest-mac-${arch_tag}.yml"
          gh release upload "$tag" "latest-mac-${arch_tag}.yml" \
            --repo "$repo" --clobber
          zip_blockmap=$(find release -name "*.zip.blockmap" -type f | head -1)
          if [ -n "$zip_blockmap" ]; then
            if [ "$arch_tag" = "arm64" ]; then
              cp "$zip_blockmap" "${arm_zip}.blockmap"
              gh release upload "$tag" "${arm_zip}.blockmap" \
                --repo "$repo" --clobber
            else
              cp "$zip_blockmap" "${x64_zip}.blockmap"
              gh release upload "$tag" "${x64_zip}.blockmap" \
                --repo "$repo" --clobber
            fi
          fi

      - name: Upload renamed assets (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @"
          ${{ matrix.assets }}
          "@ -split "`n"
          foreach ($asset in $assets) {
            if ([string]::IsNullOrWhiteSpace($asset)) {
              continue
            }
            $parts = $asset.Trim().Split("|")
            $assetName = $parts[0]
            $assetName = $assetName.Replace("__VERSION__", "v$appVersion")
            $findPattern = $parts[1]
            $file = Get-ChildItem -Path release -Recurse -Filter $findPattern | Select-Object -First 1
            if (-not $file) {
              Write-Error "No artifact matching $findPattern found"
              Get-ChildItem -Path release -Recurse -File
              exit 1
            }
            Copy-Item $file.FullName $assetName
            gh release upload "${{ env.RELEASE_TAG }}" $assetName `
              --repo "${{ github.repository }}" --clobber
          }

      - name: Upload Windows update metadata (latest.yml)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $repo = "${{ github.repository }}"
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          $windowsAssetName = "OrderBook_Windows_x64-v$appVersion.exe"
          $yml = Get-ChildItem -Path release -Recurse -Filter latest.yml | Select-Object -First 1
          if (-not $yml) {
            Write-Host "No latest.yml found; skipping update metadata upload"
            exit 0
          }
          $content = Get-Content $yml.FullName -Raw
          $content = $content -replace '商单管家-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.exe', $windowsAssetName
          Set-Content -Path latest.yml -Value $content -NoNewline
          gh release upload $tag latest.yml --repo $repo --clobber
          $blockmap = Get-ChildItem -Path release -Recurse -Filter *.exe.blockmap | Select-Object -First 1
          if ($blockmap) {
            Copy-Item $blockmap.FullName "$windowsAssetName.blockmap"
            gh release upload $tag "$windowsAssetName.blockmap" --repo $repo --clobber
          }

  merge-mac-metadata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge per-arch latest-mac.yml into latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ env.RELEASE_TAG }}"
          repo="${{ github.repository }}"
          mkdir -p _mac_meta
          gh release download "$tag" --repo "$repo" \
            --dir _mac_meta \
            --pattern 'latest-mac-arm64.yml' \
            --pattern 'latest-mac-x64.yml' || true
          if [ ! -f _mac_meta/latest-mac-arm64.yml ] && [ ! -f _mac_meta/latest-mac-x64.yml ]; then
            echo "No per-arch mac yml found; skipping merge"
            exit 0
          fi
          node scripts/merge-mac-latest-yml.mjs \
            _mac_meta/latest-mac-arm64.yml \
            _mac_meta/latest-mac-x64.yml \
            latest-mac.yml
          gh release upload "$tag" latest-mac.yml --repo "$repo" --clobber

  publish-release:
    needs: [build, merge-mac-metadata]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ env.RELEASE_TAG }}"
          repo="${{ github.repository }}"
          notes_file="release-notes.md"
          
          if [ -f .github/release-installation.md ]; then
            sed "s/{{version}}/${tag}/g" .github/release-installation.md > "$notes_file"
          else
            echo "商单管家 ${tag}" > "$notes_file"
          fi

          gh release edit "$tag" \
            --repo "$repo" \
            --notes-file "$notes_file" \
            --draft=false \
            --latest
